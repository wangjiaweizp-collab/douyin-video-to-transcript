name: 功能建议 / Feature request
description: 提出改进想法（请先确认不触碰 DISCLAIMER.md 的边界）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目只处理公开内容、不绕过风控、不获取非公开数据。
        涉及并发暴拉、验证码绕过、代理池、私密内容的建议会被直接关闭，
        详见 [DISCLAIMER.md](https://github.com/wangjiaweizp-collab/douyin-video-to-transcript/blob/main/DISCLAIMER.md)。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请先说明痛点，而不是直接给实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 涉及哪个脚本、`works.json` 契约是否需要变化
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 抓取（01）
        - 下载（02）
        - 转写 / 合并（03）
        - 配置 / 路径（lib）
        - 文档
        - CI / 工程配置
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 该建议不涉及绕过平台风控或获取非公开内容
          required: true
