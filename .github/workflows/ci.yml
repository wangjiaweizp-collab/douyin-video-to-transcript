name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    name: 静态检查 + 离线自检
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装最小依赖
        # CI 不安装 faster-whisper / ffmpeg：自检不需要真实转写，也不访问任何平台
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: 语法编译
        run: python -m compileall -q scripts

      - name: 配置模板 JSON 校验
        run: python -m json.tool config.example.json > /dev/null

      - name: 离线自检
        run: python scripts/selftest.py

      - name: Ruff 静态检查
        run: ruff check scripts

  docs-check:
    name: 文档链接与敏感信息检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 确认没有把凭据或运行时产物提交上来
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(config\.json|workspace/|\.env|cookie.*\.txt|.*\.mp4$|.*\.wav$|.*\.zip$)'; then
            echo "::error::仓库中包含敏感文件或运行时产物，请检查 .gitignore"
            exit 1
          fi
          echo "OK: 未发现敏感文件"

      - name: 检查相对链接指向的文件存在
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path('.')
          md = [root/'README.md', root/'README.en.md', root/'CONTRIBUTING.md',
                root/'SECURITY.md', root/'DISCLAIMER.md', root/'CHANGELOG.md',
                root/'docs/ARCHITECTURE.md', root/'docs/TROUBLESHOOTING.md']
          bad = []
          for f in md:
              if not f.exists():
                  continue
              for text, target in re.findall(r'\[([^\]]*)\]\(([^)]+)\)', f.read_text(encoding='utf-8')):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  p = (f.parent / target.split('#')[0]).resolve()
                  if target.split('#')[0] and not p.exists():
                      bad.append(f'{f}: {target}')
          if bad:
              print('断链:', *bad, sep='\n  ')
              sys.exit(1)
          print('OK: 所有相对链接有效')
          PY
